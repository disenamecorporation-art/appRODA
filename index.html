    <script>
      // Ensure window.fetch has both a getter and setter to prevent
      // "Cannot set property fetch of #<Window> which has only a getter"
      // when libraries or environment wrappers attempt to patch global fetch.
      (function() {
        try {
          var _fetch = window.fetch;
          var descriptor = {
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          };
          Object.defineProperty(window, 'fetch', descriptor);
          if (typeof Window !== 'undefined' && Window.prototype) {
            Object.defineProperty(Window.prototype, 'fetch', descriptor);
          }
        } catch (e) {}

        // Unregister any stale service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
        }
      })();
    </script>
